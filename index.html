<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт агента</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0F1720;--card:#17212C;--text:#E8EEF4;--muted:#9BB0C3;--ok:#3DD6B0;--warn:#F5B84B;--bad:#FF7A7A;--line:#243242;--btn:#3A4C60}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:24px 20px 16px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
h2{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:10px}
.warnc{border:1px solid var(--warn)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px}
.pr{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.pr .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pr .t{flex:1}.pr .t b{display:block;font-size:15px;font-weight:600}.pr .t span{font-size:12px;color:var(--muted)}
.pr svg{flex-shrink:0}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:0;font-weight:700;font-size:14px;padding:0 14px}
.main{background:var(--ok);color:#0F1720}.warnb{background:var(--warn);color:#0F1720}.bad{background:var(--bad);color:#0F1720}
.ghost{background:transparent;border:1px solid var(--btn);color:var(--text);font-weight:600}
.btns{display:flex;gap:10px;margin-top:12px}.btns button{flex:1}
.back{display:flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;margin:-8px 0 4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.kv span:last-child{color:var(--muted);text-align:right}
.stale{color:var(--warn);font-size:12px;margin-top:6px}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
nav a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
nav a.on{color:var(--ok);font-weight:600}
.badge{background:var(--bad);color:#0F1720;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:4px}
</style>
</head>
<body>
<div id="view"></div>
<nav>
 <a data-t="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Главная</a>
 <a data-t="queue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>Очередь<span id="qb"></span></span></a>
 <a data-t="reports"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Отчёты</a>
</nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
function dec(){try{const h=(new URLSearchParams(location.search).get('d'))||location.hash.replace(/^#/,'');if(!h)return null;const b=h.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4));return JSON.parse(decodeURIComponent(escape(bin)));}catch(e){return null}}
function send(c){if(tg){tg.sendData(JSON.stringify({c:c}));}else{alert('Открой пульт из Telegram');}}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const D=dec()||{};
const has=!!dec();
const paused=!!D.paused, auto=D.mode==='auto', pend=D.pend||[], ac=D.ac||0, sc=D.sc||0;
const chev='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BB0C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
const arrow='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
function when(){if(!has)return '<div class="muted" style="margin-top:6px">Нет данных. Открой пульт кнопкой из личного чата с ботом (/пульт).</div>';
 const t=new Date(D.ts*1000);let s='<div class="muted" style="margin-top:6px">Данные на '+t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'. Свежие: «Обновить пульт» в чате.</div>';
 if(Date.now()/1000-D.ts>900)s+='<div class="stale">Данные старше 15 минут</div>';return s;}
const PROJ=[
 {k:'chs',c:'var(--ok)',n:'Черногория Сегодня',s:()=>has?(paused?'Автопосты на паузе':'Автопосты идут, сегодня: '+ac):'Автопосты, проверка фактов'},
 {k:'ss',c:'var(--ok)',n:'Сербия Сегодня',s:()=>has?'Канал сегодня: '+sc+', Facebook: '+(D.fs||0):'Автопостинг в Telegram-канал'},
 {k:'bar',c:'var(--warn)',n:'Группа «Бар, Черногория»',s:()=>has?('Модерация: '+(auto?'авто':'вручную')+', ждут: '+pend.length):'Модерирует бот от имени CityBot',w:1},
 {k:'rem',c:'var(--ok)',n:'Remont CG',s:()=>'Радар запросов из групп'},
 {k:'home',c:'var(--ok)',n:'yourhome.me',s:()=>'Присмотр за домом'},
 {k:'wool',c:'var(--warn)',n:'MonteWool',s:()=>has?('Вещей: '+((D.mw||{}).it||0)+' (в наличии '+((D.mw||{}).av||0)+'), групп: '+((D.mw||{}).gm||0)+', заявок в группы: '+((D.mw||{}).gr||0)+', заявок покупателей: '+((D.mw||{}).ld||0)):'Страница Ольки: вязаные вещи 0–3 мес'}
];
function projDetail(k){
 if(k==='chs')return '<div class="card"><div class="muted">Последний автопост</div><div class="big">'+(has?'сегодня '+ac:'—')+'</div><div class="muted">Telegram-канал и VK. Перед выходом бот сверяет факты по источникам.</div></div>'+
  '<h2>Площадки</h2><div class="chips"><span class="chip">Telegram-канал</span><span class="chip">VK</span><span class="chip">Facebook-страница</span><span class="chip">Дзен</span><span class="chip">WhatsApp</span><span class="chip" style="border:1px solid var(--warn);color:var(--warn)">Threads: ждёт ключ</span></div>'+
  '<h2>Задачи Claude</h2><div class="card"><div class="kv"><span>12:07 посты в свои группы</span><span>нужен Chrome</span></div><div class="kv"><span>15:23 комментарии</span><span>по расписанию</span></div></div>'+
  (has?'<div class="btns"><button class="'+(paused?'main':'warnb')+'" data-c="'+(paused?'старт':'стоп')+'">'+(paused?'Включить автопосты':'Пауза автопостов')+'</button></div>':'');
 if(k==='ss')return '<div class="card"><div class="muted">Сегодня опубликовано</div><div class="big">'+(has?sc:'—')+'</div><div class="muted">Канал @serbija_today. Слоты 11:00, 15:00, 19:00, до 4 постов в день, публикация после сверки фактов.</div></div>'+
  '<h2>Сбор</h2><div class="card"><div class="kv"><span>Telegram: 8 каналов</span><span>раз в день</span></div><div class="kv"><span>Сайты: 14 лент</span><span>с 11:00</span></div><div class="kv"><span>Страница Facebook, сегодня</span><span>'+(has?(D.fs||0):'—')+'</span></div><div class="kv"><span>VK</span><span>не подключён</span></div></div>'+
  '<div class="btns"><button class="warnb" data-c="стоп сс">Пауза СС</button><button class="ghost" data-c="старт сс">Включить СС</button></div>';
 if(k==='bar')return '<div class="card"><div class="muted">Режим модерации: <b style="color:var(--text)">'+(auto?'авто':'вручную')+'</b></div><div class="btns"><button class="'+(auto?'ghost':'main')+'" data-c="'+(auto?'мод вручную':'мод авто')+'">'+(auto?'Перевести на вручную':'Включить авто')+'</button></div></div>'+
  '<h2>Правила бота</h2><div class="card"><div class="kv"><span>Реклама</span><span>удалить и мьют 3 дня</span></div><div class="kv"><span>Лимит за круг</span><span>4 действия</span></div><div class="kv"><span>Лимит в день</span><span>15 действий</span></div><div class="kv"><span>Спорные посты</span><span>два голоса моделей</span></div></div>'+
  '<div class="muted" style="margin-top:10px">Для авто нужен отдельный Chrome модератора (порт 9224).</div>'+
  '<div class="btns"><button class="main" data-go="queue">Открыть очередь</button></div>';
 if(k==='rem')return '<div class="card"><div class="muted">Ремонт и сервис в Баре: плитка, гидроизоляция, сантехника, электрика, камеры, ТВ. Работаем только через страницу.</div></div><h2>Что делает бот</h2><div class="card"><div class="kv"><span>Запросы из групп</span><span>в очередь</span></div><div class="kv"><span>Группа «Черногория»</span><span>только просмотр</span></div><div class="kv"><span>Ответы мастера</span><span>после твоего «ок»</span></div></div>';
 if(k==='home')return '<div class="card"><div class="muted">Присмотр за домом и обслуживание недвижимости для собственников, которые живут не в Черногории круглый год. Продвигаем только через страницу.</div></div><h2>План</h2><div class="card"><div class="kv"><span>Посты-кейсы</span><span>что проверили</span></div><div class="kv"><span>Ответы в группах</span><span>на вопросы</span></div><div class="kv"><span>Связка с Remont CG</span><span>заявка на ремонт</span></div></div>';
 const W=D.mw||{};
 return '<div class="card"><div class="muted">Вязаные вещи для детей 0–3 месяцев. Страница ведёт вступления в группы Черногории, ответы на комментарии и сбор заявок.</div></div>'+
  '<h2>Статистика</h2><div class="card"><div class="kv"><span>Вещей в каталоге</span><span>'+(has?(W.it||0):'—')+'</span></div><div class="kv"><span>В наличии</span><span>'+(has?(W.av||0):'—')+'</span></div><div class="kv"><span>Продано</span><span>'+(has?((W.it||0)-(W.av||0)):'—')+'</span></div><div class="kv"><span>Постов в группы</span><span>'+(has?(W.pp||0):'—')+'</span></div><div class="kv"><span>Групп в очереди</span><span>'+(has?(W.gq||0):'—')+'</span></div><div class="kv"><span>Фото в каталоге</span><span>'+(has?(W.ph||0):'—')+'</span></div><div class="kv"><span>Вступила в группы</span><span>'+(has?(W.gm||0):'—')+'</span></div><div class="kv"><span>Заявки в группы</span><span>'+(has?(W.gr||0):'—')+'</span></div><div class="kv"><span>Заявки покупателей</span><span>'+(has?(W.ld||0):'—')+'</span></div></div>'+
  '<h2>Как добавить вещь</h2><div class="card"><div class="muted">В группу «Montewool Team» пришли пачку фото с подписью: что это, материал, размер, цена. Бот напишет описание, жми «ок» или «no». Продали: «продано MW-0001». Список: «каталог».</div></div>'+
  '<div class="muted" style="margin-top:10px">Страница MonteWool работает в своём Chrome (порт 9225). Посты в группы идут на языке группы.</div>';
}
let tab='home',proj=null;
function render(){
 const v=document.getElementById('view');
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
 document.getElementById('qb').innerHTML=pend.length?'<span class="badge">'+pend.length+'</span>':'';
 let h='';
 if(tab==='home'&&!proj){
  h+='<div class="row"><h1>Пульт агента</h1><span class="pill"><i style="background:'+(has?(paused?'var(--warn)':'var(--ok)'):'var(--muted)')+'"></i>'+(has?(paused?'ЧС: пауза':'Бот работает'):'нет данных')+'</span></div>'+when();
  h+='<div class="card"><div class="row"><span class="muted">Баланс OpenRouter</span>'+(has&&D.bal!=null&&D.bal<2?'<span style="color:var(--warn);font-size:12px;font-weight:600">пополнить</span>':'')+'</div><div class="big">'+(has&&D.bal!=null?'≈ $'+String(D.bal).replace('.',','):'—')+'</div><div class="chips"><span class="chip">Основной: DeepSeek v4.1 flash</span><span class="chip">Помощник: Gemini 4 hydrogen</span></div></div>';
  h+='<h2>Проекты</h2>'+PROJ.map(p=>'<div class="card pr'+(p.w?' warnc':'')+'" data-p="'+p.k+'"><span class="d" style="background:'+p.c+'"></span><div class="t"><b>'+p.n+'</b><span>'+esc(p.s())+'</span></div>'+chev+'</div>').join('');
 }else if(tab==='home'&&proj){
  const p=PROJ.find(x=>x.k===proj);
  h+='<div class="back" id="back">'+arrow+'Главная</div><div class="row"><h1>'+p.n+'</h1></div><div class="muted" style="margin:6px 0 4px">'+esc(p.s())+'</div>'+projDetail(proj);
 }else if(tab==='queue'){
  h+='<h1>Очередь решений</h1><div class="muted" style="margin-top:6px">То, что бот не делает без твоего «ок».</div>';
  h+='<div class="card"><div class="row"><div><b style="font-size:15px">Автомодерация «Бара»</b><div class="muted">'+(auto?'Авто: бот удаляет рекламу сам':'Вручную: бот присылает список')+'</div></div><button class="'+(auto?'main':'ghost')+'" data-c="'+(auto?'мод вручную':'мод авто')+'" style="min-width:84px">'+(auto?'Авто':'Вручную')+'</button></div></div>';
  h+=!has?'<div class="card muted">Нет данных. Открой пульт кнопкой из чата с ботом.</div>':(!pend.length?'<div class="card muted">Пока ничего не ждёт.</div>':pend.map(x=>'<div class="card"><div class="muted" style="color:var(--warn);font-weight:600">мод '+esc(x.n)+' · '+esc(x.who||'автор неизвестен')+'</div><div class="btns"><button class="bad" data-c="мод '+esc(x.n)+'">Удалить и мьют</button><button class="ghost" data-c="мод '+esc(x.n)+' нет">Оставить</button></div></div>').join(''));
 }else{
  h+='<h1>Отчёты</h1>'+
  '<div class="card"><div class="row"><b style="font-size:15px">Новости Сербии</b><span class="muted">ежедневно с 11:00</span></div><div class="muted" style="margin-top:6px">Выжимка из 14 сербских сайтов: визы, ВНЖ, налоги, цены, жильё.</div></div>'+
  '<div class="card"><div class="row"><b style="font-size:15px">Telegram Сербии</b><span class="muted">раз в день</span></div><div class="muted" style="margin-top:6px">Обход 8 публичных каналов: темы, реклама, отклик.</div></div>'+
  '<div class="card"><div class="row"><b style="font-size:15px">Публикации</b><span class="muted">сегодня</span></div><div class="kv"><span>Черногория Сегодня</span><span>'+(has?ac:'—')+'</span></div><div class="kv"><span>Сербия Сегодня, канал</span><span>'+(has?sc:'—')+'</span></div><div class="kv"><span>Сербия Сегодня, Facebook</span><span>'+(has?(D.fs||0):'—')+'</span></div><div class="kv"><span>MonteWool, постов в группы</span><span>'+(has?((D.mw||{}).pp||0):'—')+'</span></div></div>'+
  '<div class="card"><div class="muted">Чеки и расходы: фото чека в чат «Ai Agent», строки пишутся в таблицу на ПК.</div></div>';
 }
 v.innerHTML=h;v.scrollTop=0;
 v.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{proj=e.dataset.p;render();});
 v.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>send(e.dataset.c));
 v.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{tab=e.dataset.go;proj=null;render();});
 const b=document.getElementById('back');if(b)b.onclick=()=>{proj=null;render();};
}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{tab=a.dataset.t;proj=null;render();});
render();
</script>
</body>
</html>
